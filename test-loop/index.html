<!doctype html>
<html><head><meta charset="utf-8"><title>loop test</title></head>
<body style="font-family:monospace;font-size:24px;background:#111;color:#0f0">
<div id="log">loading...</div>
<div id="player"></div>
<script>
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  var player;
  var events = [];
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '200', width: '350', videoId: 'aN_h1DtvnQw',
      playerVars: { autoplay: 1, mute: 1, start: 45, end: 55, controls: 1, rel: 0, playsinline: 1 },
      events: { 'onStateChange': onPlayerStateChange }
    });
    setInterval(function(){
      if (player && player.getCurrentTime) {
        var t = player.getCurrentTime().toFixed(1);
        document.getElementById('log').textContent = 'currentTime=' + t + ' | events=' + events.join(',');
        window.__log = (window.__log||[]).concat([t]);
      }
    }, 500);
  }
  function onPlayerStateChange(e) {
    events.push('state:' + e.data + '@' + (player.getCurrentTime ? player.getCurrentTime().toFixed(1) : '?'));
    if (e.data === 0) { // ENDED
      player.seekTo(45, true);
      player.playVideo();
    }
  }
</script>
</body></html>
